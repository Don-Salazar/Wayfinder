# Wayfinder CI: lint and tests on every push and pull request.
# (Upstream's package.yml handles releases and is left untouched.)
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lua:
    name: Lua (luacheck + busted, Lua 5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # The client runs Lua 5.1; the compile spec asserts PUC-Rio 5.1.
      - name: Install Lua 5.1.5
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      # Same versions as tools/dev/setup-lua.ps1, so local and CI agree.
      # (luarocks install takes one rock per call.)
      - name: Install luacheck and busted
        run: |
          luarocks install luacheck 1.2.0-1
          luarocks install busted 2.2.0-1

      # -q: print only files with problems; plain: one "file:line:col: (Wxxx) msg" line each.
      # Each such line is also emitted as a GitHub annotation (readable through the
      # public API without log access); the step still exits with luacheck's status.
      - name: luacheck
        shell: bash
        run: |
          out="$RUNNER_TEMP/luacheck.out"
          status=0
          luacheck . -q --formatter plain > "$out" 2>&1 || status=$?
          cat "$out"
          sed -e 's/%/%25/g' "$out" \
            | sed -nE 's/^([^:]+):([0-9]+):([0-9]+): \(([A-Z][0-9]+)\) (.*)$/::error file=\1,line=\2,col=\3::\4 \5/p'
          exit "$status"

      - name: busted
        run: busted

      # Syntax-check the addon as shipped: tools/build-addon renames identifiers
      # in a copy (dist/Wayfinder), so compile that copy under real Lua 5.1.
      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:addon

      - name: luac -p over dist/Wayfinder (Lua 5.1)
        shell: bash
        run: |
          set -o pipefail
          find dist/Wayfinder -type f -name "*.lua" -print0 | xargs -0 -n 200 luac -p
          echo "luac -p: $(find dist/Wayfinder -type f -name "*.lua" | wc -l) files OK"

  node:
    name: Node tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (full history, for the origin check)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:toc
      - run: npm run check:manifests
      - run: npm run check:origins
      - run: npm run check:addon
